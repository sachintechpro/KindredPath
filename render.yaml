databases:
  - name: kindredpath-db
    plan: free
    region: ohio
    postgresMajorVersion: 18

services:
  - type: web
    name: kindredpath
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./kindredpath
    dockerfilePath: ./kindredpath/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kindredpath-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LEAD_EMAIL_TO
        value: sachin.techpro@gmail.com
